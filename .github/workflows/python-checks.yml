# Python lint / format / type-check for the pose-accuracy harness.
#
# The pose-accuracy gate validates scores, but nothing checked code quality.
# On PRs touching Python files this runs:
#   ruff check          (lint)
#   ruff format --check (formatting)
#   mypy PoseAccuracy   (type-check)
# All tool versions pinned, matching the repo's pinned-dependency convention
# (requirements.txt pins ==, actions pin to SHAs). The checks are hermetic:
# only the tools are installed, never the harness deps — mypy runs with
# ignore_missing_imports (see pyproject.toml) so fork PRs need no secrets.
name: Python checks

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  RUFF_VERSION: '0.16.7'
  MYPY_VERSION: '2.3.1'

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tooling
        run: pip install "ruff==${{ env.RUFF_VERSION }}" "mypy==${{ env.MYPY_VERSION }}"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy PoseAccuracy
        run: mypy PoseAccuracy
