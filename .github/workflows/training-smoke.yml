# Training smoke test: every PR touching the training pipeline runs the
# champion training script end-to-end on the tiny synthetic fixture plus the
# Training/ unit tests (turnip-ml#13).
#
# Deliberately ubuntu-only and Python-only, mirroring pose-accuracy.yml: it
# must not duplicate the Xcode build, and it must work on fork PRs (plain
# `pull_request`, never `pull_request_target`). The fixture is synthetic and
# committed, so no secrets or downloads are needed.
name: Training smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'Training/**'
      - '.github/workflows/training-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Training/requirements.txt

      - name: Install training dependencies
        run: pip install -r Training/requirements.txt

      # End-to-end smoke: the script must run on the fixture and reach 100%
      # val accuracy (the fixture is separable by construction — anything
      # less is a training-pipeline bug). train.py exits non-zero on failure.
      - name: Smoke-train on the synthetic fixture
        run: |
          python Training/train.py \
            --config Training/config/smoke.toml \
            --out "$RUNNER_TEMP/smoke-run"
          python - <<'EOF'
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],
                                          "smoke-run", "metrics.json")))
          assert m["val_accuracy"] == 1.0, m
          print(f"smoke OK: val_accuracy={m['val_accuracy']}, "
                f"loss {m['train_loss_initial']:.4f} -> {m['train_loss_final']:.4f}")
          EOF

      - name: Training unit tests
        run: python -m unittest discover -s Training/tests -t .
